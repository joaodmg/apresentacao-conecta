*{box-sizing:border-box}

body{font:var(--fs)/1.5 var(--sans);color:var(--ink);overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));transition:background .35s,color .35s}

@keyframes up{from{opacity:0;transform:translateY(14px)}}
.in{width:100%;max-width:1160px;margin:0 auto;text-align:left}
.cover{text-align:center}

h1{font-size:2.9em;margin:.1em 0 .35em}
h2{font-size:2.2em;border-left:.16em solid var(--sun);padding-left:.4em}

.note{margin:1em 0 0;padding-top:.7em;border-top:1px solid var(--line);color:var(--mute);font-size:.95em}

.logo{width:clamp(100px,min(18vw,22vh),180px);aspect-ratio:1;color:var(--ink);margin-bottom:.3em}
.on .logo{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}

.cover .sub{color:var(--mute);margin:0 0 .6em}
.cover .lead{margin-inline:auto;text-align:center}

.gal.t0 .a{opacity:0}.gal.t1 .d{opacity:0}
.cap{margin:.8em 0 0;font-size:.88em;line-height:1.4;color:var(--mute);text-align:center}

.ring svg{position:absolute;inset:0;width:100%;height:100%}

.nd b{display:grid;place-items:center;width:2em;height:2em;border-radius:50%;background:var(--sun);color:#14293b;font-family:var(--serif)}
.nd:hover:not(:disabled){background:var(--surf);border-color:var(--sun);transform:translate(-50%,-50%) scale(1.05)}
.refs{columns:2;column-gap:2.2em}

button{width:42px;height:42px;border-radius:50%;border:0;background:var(--b);color:#fff;font:600 24px/1 var(--sans);cursor:pointer;padding:0 0 3px;transition:background .2s,transform .2s}

.hint{color:var(--mute);font-size:.82em;text-align:center}

.pl{width:auto;height:auto;border-radius:2em;padding:.5em 1.2em;font:600 .95em/1.2 var(--sans)}
.hint{color:var(--mute);font-size:.85em;text-align:center}

.crf .cap{margin:.2em 0 0}
